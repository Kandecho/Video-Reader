[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-video-reader"
version = "0.10.0rc5"
description = "Video as readable source material for multimodal agents"
requires-python = ">=3.11"
dependencies = ["Pillow>=12,<13", "filelock>=3.20,<5", "yt-dlp==2026.08.19", "yt-dlp-ejs==0.8.0", "qrcode==8.2", "cryptography>=45,<51"]

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
asr = ["faster-whisper>=1.2,<2", "av>=11,<17"]
vision = ["rapidocr-onnxruntime==1.4.4"]

[project.scripts]
video-reader = "video_reader.cli:main"
video-reader-mcp = "video_reader.mcp_server:main"

[tool.setuptools.packages.find]
include = ["video_reader*", "scroll_agent*"]

[tool.setuptools.package-data]
video_reader = ["defaults.json"]
