<a class="skip" href="#records">跳到任务列表</a>
<main class="shell">
  <header class="masthead">
    <div><div class="title-line"><h1>任务目录</h1></div><p class="subtitle">从一次具体任务，找到结果与留存处置。</p></div>
    <div class="header-actions"><button class="theme-button" id="reload" type="button">刷新目录</button><button class="theme-button" id="theme" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14A8.5 8.5 0 0 1 10 3.6 8.5 8.5 0 1 0 20.4 14Z"/></svg><span id="theme-label">深色</span></button></div>
  </header>
  <div class="workspace">
    <aside class="sidebar" aria-label="按任务类型筛选"><h2>任务类型</h2><nav id="type-nav" class="type-nav" aria-label="任务类型"></nav><div class="sidebar-note"><p>同一份材料，可以服务于不同任务。</p><p>类型说明要做哪类工作。具体要求、保存目的与处置，留在每项任务里。</p></div></aside>
    <section class="content" aria-label="任务列表与筛选">
      <form id="filters" class="filters" role="search" autocomplete="off">
        <div class="filter-primary">
          <label class="field search-field"><span class="field-label">查找任务</span><div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="q" type="search" placeholder="任务描述、材料标题或处置关键词" aria-controls="records"></div></label>
          <label class="field"><span class="field-label">任务状态</span><select id="status"><option value="">全部状态</option><option value="__open">待完成</option><option value="pending">待处理</option><option value="paused">暂停</option><option value="done">已完成</option><option value="cancelled">已取消</option><option value="archived">已归档</option></select></label>
          <label class="field mobile-type"><span class="field-label">任务类型</span><select id="task-type"><option value="">全部类型</option></select></label>
        </div>
        <div class="filter-tools">
          <details id="more-filters" class="more-filters"><summary>更多筛选</summary><div class="extra-fields"><label class="field"><span class="field-label">来源批次</span><select id="batch"><option value="">全部批次</option></select></label><label class="field"><span class="field-label">排列方式</span><select id="sort"><option value="updated">最近记录更新</option><option value="created">最近发起任务</option></select></label></div></details>
          <div class="quiet-actions"><button id="reset" class="text-button" type="button">清除筛选</button><button id="copy-view" class="text-button" type="button">复制视图</button></div>
        </div><p id="message" class="message" role="status"></p>
      </form>
      <div class="list-heading"><h2><span id="list-title">全部任务</span><span id="count" class="count" aria-live="polite"></span></h2><span id="snapshot-time" class="snapshot-time"></span></div>
      <div class="ledger"><div class="column-head" aria-hidden="true"><span>任务状态</span><span>任务类型</span><span>任务描述与处置</span></div><section id="records" tabindex="-1" aria-label="任务记录"></section><div id="empty" class="empty" hidden><h3>没有匹配的任务</h3><p>试试更短的关键词，或清除状态与类型条件。</p><button id="empty-reset" type="button">查看全部任务</button></div></div>
      <footer class="footer"><p id="catalog-note">按任务状态与类型查找；具体要求、保存目的与留存处置分别保留。新记录保存后，可刷新目录查看。</p><p><span id="totals"></span> · <a href="prototypes/task-catalog-20261114/index.html">设计参考</a></p></footer>
    </section>
  </div>
</main>
<div id="catalog-file-links" hidden aria-hidden="true">__CATALOG_FILE_LINKS__</div>
<script id="catalog-data" type="application/json">__CATALOG_DATA__</script>
<script>
'use strict';
(() => {
  const data=JSON.parse(document.getElementById('catalog-data').textContent);
  const tasks=Array.isArray(data.tasks)?data.tasks:[], types=Array.isArray(data.types)?data.types:[], views=data.views||[];
  const UNTYPED='__untyped';
  const names={pending:'待处理',paused:'暂停',done:'已完成',cancelled:'已取消',archived:'已归档'};
  const controls=Object.fromEntries(['q','status','task-type','batch','sort'].map(id=>[id,document.getElementById(id)]));
  let selectedType='';
  const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
  const text=value=>value==null?'':typeof value==='string'?value:Array.isArray(value)?value.map(text).filter(Boolean).join('、'):typeof value==='object'?Object.entries(value).map(([k,v])=>k+'：'+text(v)).join('；'):String(value);
  const norm=value=>text(value).normalize('NFKC').toLocaleLowerCase().replace(/\s+/g,' ').trim();
  const date=(value,withTime=false)=>{if(value==null||value==='')return '日期未登记';const d=typeof value==='number'?new Date(value*1000):new Date(value);return Number.isNaN(d.valueOf())?'日期未登记':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',...(withTime?{hour:'2-digit',minute:'2-digit',hour12:false}:{})}).format(d);};
  const safeURL=value=>{if(typeof value!=='string'||!value.trim())return null;try{const url=new URL(value,document.baseURI);return ['file:','http:','https:'].includes(url.protocol)?url.href:null;}catch{return null;}};
  const link=(label,url,cls='')=>{const href=safeURL(url);if(!href)return el('span',cls,label);const a=el('a',cls,label);a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a;};
  const artifactAnchors=new Map([...document.querySelectorAll('#catalog-file-links a[data-artifact-path]')].map(a=>[a.dataset.artifactPath,a]));
  const artifactLink=(label,file,cls='')=>link(label,artifactAnchors.get(file.path)?.getAttribute('href')??file.url,cls);
  const option=(node,value,label)=>{const o=el('option','',label);o.value=value;node.append(o);};
  const basename=path=>String(path||'').replace(/\\/g,'/').split('/').pop()||'文件';
  const results=task=>[...(task.results||[])].sort((a,b)=>(Number(b.created_at)||0)-(Number(a.created_at)||0)||(Number(b.id)||0)-(Number(a.id)||0));
  const answer=result=>result?.answer&&typeof result.answer.text==='string'&&result.answer.text.trim()?result.answer:null;
  const followups=task=>[...(task.followups||[])].sort((a,b)=>(Number(b.updated_at)||0)-(Number(a.updated_at)||0));
  const updated=task=>Math.max(Number(task.updated_at)||0,...results(task).map(r=>Number(r.created_at)||0),...followups(task).map(r=>Number(r.updated_at)||0));
  const open=state=>state==='pending'||state==='paused';
  const displayState=task=>task.state;
  const taskType=task=>typeof task.task_type==='string'&&task.task_type.trim()?task.task_type:null;
  const typeKey=task=>taskType(task)??UNTYPED;
  const typeLabel=value=>value===UNTYPED||value==null?'未注明':value;
  const filterTypes=[...types.map(type=>({name:type.name,label:type.name})),...(tasks.some(task=>taskType(task)===null)?[{name:UNTYPED,label:'未注明'}]:[])];
  const statusMatches=(task,value)=>!value||(value==='__open'?open(displayState(task)):displayState(task)===value);
  const taskDescription=task=>typeof task.task_description==='string'&&task.task_description.trim()?task.task_description:'未填写任务描述';
  const rawFilters=()=>({q:controls.q.value.trim(),status:controls.status.value,type:selectedType,batch:controls.batch.value,sort:controls.sort.value});
  const searchable=task=>norm([taskDescription(task),task.title,task.source_title,task.source,task.request,task.task_type,task.completion_method,task.note?.original,task.note?.comment,task.metadata?.purposes,task.metadata?.reason,task.metadata?.keep,task.metadata?.notes,...results(task).map(r=>[r.summary,r.answer?.question,r.answer?.text,r.answer?.limitations,r.task_scope]),...followups(task).map(r=>[r.description,r.reason,r.notes,...(r.artifacts||[]).map(a=>a.path)])]);
  const searchIndex=new Map(tasks.map(task=>[task.id,searchable(task)]));
  function matches(task,f,includeType=true){if(!statusMatches(task,f.status))return false;if(includeType&&f.type&&typeKey(task)!==f.type)return false;const view=views.find(v=>String(v.id)===f.batch);if(view&&!(view.task_ids||[]).includes(task.id))return false;return norm(f.q).split(' ').filter(Boolean).every(word=>searchIndex.get(task.id).includes(word));}
  filterTypes.forEach(type=>option(controls['task-type'],type.name,type.label));
  views.forEach(view=>option(controls.batch,String(view.id),String(view.label||view.id)));
  const typeButtons=[];
  [{name:'',label:'全部类型'},...filterTypes].forEach(type=>{const b=el('button');b.type='button';b.dataset.type=type.name;b.setAttribute('aria-pressed',String(!type.name));b.append(el('span','',type.label),el('span','type-count'));b.addEventListener('click',()=>{selectedType=type.name;controls['task-type'].value=selectedType;render();});document.getElementById('type-nav').append(b);typeButtons.push(b);});
  function setFromHash(){
    const p=new URLSearchParams(location.hash.slice(1)),legacyDescription=p.get('description')||'';
    controls.q.value=p.get('q')||legacyDescription;
    ['status','batch','sort'].forEach(key=>{const value=p.get(key)||(key==='status'?p.get('state'):null)||(key==='sort'?'updated':'');controls[key].value=[...controls[key].options].some(o=>o.value===value)?value:(key==='sort'?'updated':'');});
    const legacyTypes={'整理为笔记':'整理笔记','保存至 Casebook':'案例收录','仅本地收藏':'收藏','核查论据与观点':'核查','Reader 阅读验证':'阅读验证','试用并接入动效工具':'试用工具','整片翻译':'翻译'};
    let requestedType=p.get('type')||'';
    if(!requestedType&&!p.get('q')&&legacyTypes[legacyDescription]&&types.some(type=>type.name===legacyTypes[legacyDescription])){requestedType=legacyTypes[legacyDescription];controls.q.value='';}
    if(['未注明','待确认'].includes(requestedType)&&!types.some(type=>type.name===requestedType))requestedType=UNTYPED;
    selectedType=filterTypes.some(type=>type.name===requestedType)?requestedType:'';controls['task-type'].value=selectedType;
    document.getElementById('more-filters').open=Boolean(controls.batch.value||controls.sort.value!=='updated');
  }
  function saveHash(f){const p=new URLSearchParams();for(const [key,value]of Object.entries(f))if(value&&!(key==='sort'&&value==='updated'))p.set(key,value);const hash=p.size?'#'+p.toString():'';if(location.hash!==hash){try{history.replaceState(null,'',location.pathname+location.search+hash);}catch{location.hash=p.toString();}}}
  function artifactList(artifacts){const list=el('ul','file-list');(artifacts||[]).forEach(a=>{const li=el('li');if(a.exists===false)li.append(el('span','missing',a.name||basename(a.path)),el('span','file-note missing','文件缺失'));else{li.append(artifactLink(a.name||basename(a.path),a));if(a.hash_valid===false)li.append(el('span','file-note changed','文件已变化，当前文件不等同当时版本'));}if(a.path)li.append(el('p','file-path',a.path));list.append(li);});return list;}
  function primaryArtifact(task){const records=results(task);if(task.primary_artifact_path){for(const result of records){const file=(result.artifacts||[]).find(a=>a.path===task.primary_artifact_path&&a.exists!==false&&a.hash_valid!==false);if(file)return file;}}const artifacts=(records[0]?.artifacts||[]).filter(a=>a.exists!==false);return ['html','htm','md','pdf','docx','txt','mp4','webm'].map(format=>artifacts.find(a=>String(a.format||'').toLowerCase()===format)).find(Boolean);}
  function dispositionText(task){const latest=results(task)[0],state=displayState(task);if(task.result_matches_task===false)return '任务描述已改变，现有成果对应此前要求。';if(state==='done'&&task.completion_method==='终止')return '完成方式：终止。'+(latest?.summary||'任务已结束，保留已有记录。');if(state==='cancelled')return '任务已取消，保留已有记录。';if(state==='paused')return answer(latest)?.status==='partial'?'已有部分答复，任务暂停。':'任务暂停，现有成果保留。';if(state!=='done')return latest?'已有部分成果，任务尚未完成。':'尚未登记成果。';if(!latest)return '完成标记缺少成果记录。';if(task.task_type==='回答问题')return answer(latest)?'已回答问题。':'已有答复成果，见任务详情。';return ({整理笔记:'笔记已保存在本地。',阅读验证:'约定范围内的验证已完成。',核查:'核查结果已保存。',收藏:'已本地收藏。',试用工具:'试用结果与适用边界已保存。',案例收录:'已收录至 Casebook。',翻译:'约定范围的译文已保存。'})[task.task_type]||'已登记任务成果。';}
  function renderDisposition(task){const block=el('div','disposition');block.append(el('span','disposition-label','处置'));const lines=el('div','disposition-lines');lines.append(el('p','',dispositionText(task)));followups(task).forEach(record=>{const p=el('p');const label=open(record.state)?'待处置':names[record.state]||record.state;p.append(el('span','action-state '+(record.state==='done'?'action-done':open(record.state)?'action-open':''),label+'：'),document.createTextNode(record.description));const file=(record.artifacts||[]).find(a=>a.exists!==false);if(file)p.append(artifactLink('查看副本',file,'storage-link'));if((record.artifacts||[]).some(a=>a.exists===false))p.append(el('span','warning missing',' · 有文件缺失'));if((record.artifacts||[]).some(a=>a.hash_valid===false))p.append(el('span','warning',' · 有文件已变化'));lines.append(p);});block.append(lines);return block;}
  function renderResult(result,isLatest){const block=el('section','history-record');const meta=el('div','result-meta');meta.append(el('span','',date(result.created_at,true)+(isLatest?' · 最新登记':'')),el('span','',result.complete?'当时登记为完成':'当时保留部分成果'));block.append(meta);const direct=answer(result);if(direct){if(direct.question)block.append(el('p','answer-question','问题：'+direct.question));block.append(el('p','answer-text',direct.text));if(direct.limitations)block.append(el('p','answer-limits','局限：'+direct.limitations));if(direct.basis)block.append(el('p','answer-basis','依据：'+direct.basis));}else block.append(el('p','result-summary',result.summary||'未登记摘要'));if(result.task_scope)block.append(el('p','scope','处理范围：'+text(result.task_scope)));block.append(el('p','scope',result.full_video_verified===true?'已登记全片核验。':'未声明全片核验。'));block.append(artifactList(result.artifacts));if(result.coverage&&Object.keys(result.coverage).length){const raw=el('details','raw-coverage');raw.append(el('summary','','查看完整处理范围'),el('pre','',JSON.stringify(result.coverage,null,2)));block.append(raw);}return block;}
  function factList(pairs){const dl=el('dl','detail-facts');pairs.filter(pair=>pair[1]!=null&&text(pair[1]).trim()).forEach(([label,value])=>{dl.append(el('dt','',label),el('dd','',text(value)));});return dl;}
  function renderDetail(task){const detail=el('details','task-detail');detail.append(el('summary','',task.result_matches_task===false?'查看此前成果与详情':answer(results(task)[0])?'查看答复与详情':'查看任务详情'));const body=el('div','detail-body');const context=el('section','detail-section');context.append(el('h3','','任务与材料'),factList([['任务描述',taskDescription(task)],['已登记要求',task.note?.kind==='comment'?null:task.request],['任务类型',typeLabel(taskType(task))],['任务状态',names[displayState(task)]||displayState(task)],['完成方式',task.completion_method],['保存目的',task.metadata?.reason||task.metadata?.purposes],['保留内容',task.metadata?.keep],['留存方式',task.metadata?.retention],[task.completion_method?'原记录说明':'补充说明',task.metadata?.notes]]));const source=el('p','source-line');source.append(link(task.source_title||task.title||task.source,task.source));context.append(source);if(task.note?.original||(task.messages||[]).length){const origins=el('details','source-evidence');origins.append(el('summary','','原话与来源记录'));if(task.note?.original)origins.append(el('p','',(task.note.kind==='comment'?'评论性附言：':'已保存原话／任务：')+task.note.original));(task.messages||[]).forEach(message=>origins.append(el('p','',date(message.sent_at??message.created_at,true)+' · '+(message.id||'关联消息')+'\n'+(message.text||''))));context.append(origins);}body.append(context);
    const latest=results(task)[0];if(latest){const output=el('section','detail-section');output.append(el('h3','',task.result_matches_task===false?'此前成果':answer(latest)?'直接答复':'当前成果'),renderResult(latest,true));const older=results(task).slice(1);if(older.length){const history=el('details','result-history');history.append(el('summary','','此前 '+older.length+' 次成果'));older.forEach(result=>history.append(renderResult(result,false)));output.append(history);}body.append(output);}
    if(followups(task).length){const section=el('section','detail-section');section.append(el('h3','','留存与处置记录'));followups(task).forEach(record=>{const item=el('div','followup-detail');item.append(el('h4','',(names[record.state]||record.state)+'：'+record.description));if(record.reason)item.append(el('p','','理由：'+record.reason));if(record.notes)item.append(el('p','',record.notes));item.append(artifactList(record.artifacts),el('p','scope','登记于 '+date(record.created_at,true)));section.append(item);});body.append(section);}detail.append(body);return detail;}
  function renderCover(task){
    const placeholder=()=>el('div','cover-placeholder','暂无封面');
    const imageURL=safeURL(task.cover_url);
    if(!imageURL||new URL(imageURL).protocol!=='file:')return placeholder();
    const image=el('img','video-cover');image.src=imageURL;image.alt='';image.width=112;image.height=63;image.loading='lazy';image.decoding='async';
    const target=link('',task.source,'cover-link');target.setAttribute('aria-label','打开视频：'+(task.source_title||task.title||'原视频'));target.append(image);
    image.addEventListener('error',()=>target.replaceWith(placeholder()));return target;
  }
  function renderTask(task){
    const row=el('article','record');row.dataset.taskId=task.id;row.id='task-'+task.id;
    const state=displayState(task), stateBlock=el('div','record-status');stateBlock.append(el('span','task-status state-'+state,names[state]||state));
    if(state==='done'&&task.completion_method)stateBlock.append(el('p','completion-method',task.completion_method));
    row.append(stateBlock,el('div','record-type task-type',typeLabel(taskType(task))));
    const body=el('div','record-body');body.append(el('h2','task-description',taskDescription(task)));
    const context=el('div','material-context'), materialInfo=el('div','material-info'), material=el('p','source-line');
    material.append(el('span','source-label','材料'),link(task.source_title||task.title||task.source,task.source));materialInfo.append(material);
    const purpose=task.metadata?.reason||text(task.metadata?.purposes);if(purpose)materialInfo.append(el('p','purpose','目的：'+purpose));
    context.append(renderCover(task),materialInfo);body.append(context,renderDisposition(task));
    const latest=results(task)[0];
    if(task.result_matches_task===false||(state==='done'&&latest?.task_request!=null&&latest.task_request!==task.request))body.append(el('p','warning','任务要求已改变，当前展示的是此前登记成果。'));
    if(task.delivery?.matches_target===false)body.append(el('p','warning','实际成果与目标交付格式尚不一致。'));
    const file=primaryArtifact(task);
    if(file&&!answer(latest)){
      const actions=el('div','record-actions');
      const label=task.completion_method==='终止'?'查看终止记录':task.task_type==='整理笔记'?'打开笔记':task.task_type==='案例收录'?'查看案例':'打开成果';
      actions.append(artifactLink(label,file,'main-artifact'),el('span','record-date','记录更新 '+date(updated(task))));
      if(file.hash_valid===false)actions.append(el('span','warning','文件已变化'));body.append(actions);
    }
    body.append(renderDetail(task));row.append(body);return row;
  }
  function render(){const f=rawFilters();const visible=tasks.filter(task=>matches(task,f)).sort((a,b)=>(f.sort==='created'?(Number(b.created_at)||0)-(Number(a.created_at)||0):updated(b)-updated(a))||String(a.id).localeCompare(String(b.id)));document.getElementById('records').replaceChildren(...visible.map(renderTask));document.getElementById('empty').hidden=visible.length>0;document.getElementById('count').textContent=visible.length+' 项';document.getElementById('list-title').textContent=f.type?typeLabel(f.type):'全部任务';typeButtons.forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.type===f.type));button.querySelector('.type-count').textContent=tasks.filter(task=>matches(task,f,false)&&(!button.dataset.type||typeKey(task)===button.dataset.type)).length;});document.getElementById('reset').disabled=!f.q&&!f.status&&!f.type&&!f.batch;saveHash(f);}
  function reset(){controls.q.value='';controls.status.value='';controls.batch.value='';selectedType='';controls['task-type'].value='';document.getElementById('message').textContent='';document.getElementById('more-filters').open=false;render();controls.q.focus();}
  document.getElementById('filters').addEventListener('submit',event=>event.preventDefault());controls.q.addEventListener('input',render);['status','batch','sort'].forEach(id=>controls[id].addEventListener('change',render));controls['task-type'].addEventListener('change',()=>{selectedType=controls['task-type'].value;render();});document.getElementById('reset').addEventListener('click',reset);document.getElementById('empty-reset').addEventListener('click',reset);window.addEventListener('hashchange',()=>{setFromHash();render();});
  document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();const list=document.getElementById('records');list.scrollIntoView({block:'start'});list.focus({preventScroll:true});});
  document.getElementById('reload').addEventListener('click',()=>location.reload());
  const dark=()=>document.documentElement.dataset.theme==='dark';const updateTheme=()=>{const label=dark()?'浅色':'深色';document.getElementById('theme-label').textContent=label;document.getElementById('theme').setAttribute('aria-label','切换'+label+'外观');};try{if(localStorage.getItem('video-catalog-theme')==='dark')document.documentElement.dataset.theme='dark';}catch{}document.getElementById('theme').addEventListener('click',()=>{const theme=dark()?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('video-catalog-theme',theme);}catch{}updateTheme();});updateTheme();
  document.getElementById('copy-view').addEventListener('click',async()=>{const message=document.getElementById('message');try{await navigator.clipboard.writeText(location.href);message.textContent='已复制当前视图。';}catch{message.textContent='地址栏已包含筛选条件，可以直接复制。';}});
  document.getElementById('snapshot-time').textContent='记录截至 '+date(data.generated_at,true);document.getElementById('totals').textContent=tasks.length+' 项任务 · '+new Set(tasks.map(t=>t.source)).size+' 份来源 · '+tasks.reduce((n,t)=>n+(t.results||[]).length,0)+' 次成果';setFromHash();render();
})();
</script>
